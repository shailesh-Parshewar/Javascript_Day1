<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function convertToTemp(num, unit = "C") {
            return unit == "C" ? (num - 32) * 5/9 : (num * 9/5) + 32
        }
        console.log(convertToTemp(25, "C"))
        console.log(convertToTemp(90, "F"))
    </script>
</body>
</html>
