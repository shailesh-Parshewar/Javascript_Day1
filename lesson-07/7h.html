<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function convertToLength(length, from, to) {
           if(from == "miles") {
                if(to == "km") {
                    return `${length * 1.6} km`;
                }
                else if(to == "ft") {
                    return `${length * 5280} ft`
                }
                else {
                    return `${length} miles`
                }
           } else if(from == "km") {
                if(to == "miles") {
                    return `${length / 1.6} Miles`
                } else if(to == "ft") {
                    return `${length * 3281} ft`
                } else {
                    return `${length} km`
                }
           } else if(from == "ft") {
                    if(to == "miles") {
                        return `${length / 5280}`
                    } else if(to == "km") {
                        return `${length / 3281}`
                    } else {
                        return `${length} ft`
                    }
           } 
           else {
                return length
           }
        }

        console.log(convertToLength(50, "miles", "km"))
        console.log(convertToLength(32, "km", "miles"))
        console.log(convertToLength(10, "km", "ft"))
        console.log(convertToLength(10, "miles", "ft"))
    </script>
</body>
</html>
