<body>
    <script>
        const obj1 = {
            name : "basketball",
            price : 3095
        }
        const obj2 = {
            name : "Baseball",
            price : 1005
        }
        function compareProduct(p1, p2) {
            return p1.price > p2.price ? p2 : p1
        }
        console.log(compareProduct(obj1, obj2))
    </script>
