<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="playGame('Heads')">Heads</button>
    <button onclick="playGame('Tails')">Tails</button>
    <script>
        const score = localStorage.getItem("score") ? JSON.parse(localStorage.getItem("score")) : {
            wins : 0,
            losses : 0,
        }
        function playGame(guess) {
            const variable = Math.random();
            const result = variable > 0.5 ? "Tails" : "Heads"
            if(result == guess) {
                console.log("You won!")
                score.wins += 1
                localStorage.setItem("score", JSON.stringify(score))
            } else {
                console.log("Try again")
                score.losses += 1
                localStorage.setItem("score", JSON.stringify(score))
            }
            console.log(score)
        }
    </script>
</body>
</html>
